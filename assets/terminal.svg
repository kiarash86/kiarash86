      <text x="365" y="0"><animate attributeName="y" values="-20;220" dur="3.0s" repeatCount="indefinite" begin="0.3s"/>bash</text>
      <text x="425" y="0"><animate attributeName="y" values="-20;220" dur="2.8s" repeatCount="indefinite" begin="0.9s"/>tcp</text>
      <text x="475" y="0"><animate attributeName="y" values="-20;220" dur="3.5s" repeatCount="indefinite" begin="0.1s"/>443</text>
      <text x="525" y="0"><animate attributeName="y" values="-20;220" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>OK</text>
      <text x="565" y="0"><animate attributeName="y" values="-20;220" dur="3.3s" repeatCount="indefinite" begin="0.5s"/>git</text>
      <text x="615" y="0"><animate attributeName="y" values="-20;220" dur="2.9s" repeatCount="indefinite" begin="1.0s"/>200</text>
      <text x="665" y="0"><animate attributeName="y" values="-20;220" dur="3.7s" repeatCount="indefinite" begin="0.7s"/>sudo</text>
      <text x="725" y="0"><animate attributeName="y" values="-20;220" dur="2.6s" repeatCount="indefinite" begin="1.3s"/>10</text>
      <text x="765" y="0"><animate attributeName="y" values="-20;220" dur="3.1s" repeatCount="indefinite" begin="0.4s"/>nc</text>
