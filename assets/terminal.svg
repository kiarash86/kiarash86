    <rect x="0" y="0" width="800" height="200" fill="#0D1117" opacity="0.55"/>

    <g font-family="Consolas, Menlo, monospace" font-size="18">
      <circle cx="24" cy="24" r="6" fill="#FF5F56"/>
      <circle cx="46" cy="24" r="6" fill="#FFBD2E"/>
      <circle cx="68" cy="24" r="6" fill="#27C93F"/>

      <text x="30" y="80" fill="#00F5A0">$ whoami</text>
      <text x="30" y="80" fill="#00F5A0" opacity="0">
        <animate attributeName="opacity" values="0;0;1" dur="6s" keyTimes="0;0.01;0.02" repeatCount="indefinite"/>
      </text>

      <text x="30" y="110" fill="#FFFFFF">
        kiarash86
        <animate attributeName="opacity" values="0;1" dur="0.1s" begin="0.6s" fill="freeze"/>
      </text>

      <text x="30" y="140" fill="#8FE9D0">
        backend developer // go // security
      </text>

      <rect x="30" y="150" width="10" height="18" fill="#00F5A0">
