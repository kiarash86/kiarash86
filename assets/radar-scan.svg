<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip2">
      <rect x="0" y="0" width="800" height="220" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip2)">
    <rect width="800" height="220" fill="#0D1117"/>

    <g transform="translate(150,110)">
      <circle r="90" fill="none" stroke="#1F3B3A" stroke-width="1"/>
      <circle r="60" fill="none" stroke="#1F3B3A" stroke-width="1"/>
      <circle r="30" fill="none" stroke="#1F3B3A" stroke-width="1"/>
      <line x1="-90" y1="0" x2="90" y2="0" stroke="#1F3B3A" stroke-width="1"/>
      <line x1="0" y1="-90" x2="0" y2="90" stroke="#1F3B3A" stroke-width="1"/>

      <g>
        <path d="M0 0 L90 0 A90 90 0 0 1 63.6 63.6 Z" fill="url(#radarFade)"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </g>

      <circle cx="45" cy="-30" r="4" fill="#FF5F56">
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-55" cy="20" r="4" fill="#FFBD2E">
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="65" r="4" fill="#00F5A0">
        <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.8s" repeatCount="indefinite"/>
      </circle>

      <circle r="3" fill="#00F5A0"/>
    </g>

    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#8FE9D0">
      <text x="330" y="55" fill="#00F5A0">root@recon:~$ nmap -sV target.io</text>

      <text x="330" y="80">
        <tspan>PORT</tspan><tspan dx="30">STATE</tspan><tspan dx="20">SERVICE</tspan>
      </text>

      <text x="330" y="102" opacity="0">
        22/tcp   open   ssh
        <animate attributeName="opacity" values="0;0;1" dur="4s" keyTimes="0;0.08;0.12" repeatCount="indefinite"/>
      </text>
      <text x="330" y="122" opacity="0">
        80/tcp   open   http
        <animate attributeName="opacity" values="0;0;1" dur="4s" keyTimes="0;0.2;0.24" repeatCount="indefinite"/>
      </text>
      <text x="330" y="142" opacity="0">
        443/tcp  open   https
        <animate attributeName="opacity" values="0;0;1" dur="4s" keyTimes="0;0.32;0.36" repeatCount="indefinite"/>
      </text>
      <text x="330" y="162" fill="#FFFFFF" opacity="0">
        3 open ports found.
        <animate attributeName="opacity" values="0;0;1" dur="4s" keyTimes="0;0.5;0.55" repeatCount="indefinite"/>
      </text>

      <rect x="330" y="170" width="9" height="15" fill="#00F5A0">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
