<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- GitHub native dark background, flat -->
  <rect width="1200" height="270" fill="#0D1117"/>

  <!-- left edge intentionally left plain -->


  <!-- subtle scanline sweeping top to bottom, like a security scan -->
  <rect x="0" y="0" width="1200" height="2.5" fill="url(#scanline)">
    <animate attributeName="y" values="-10;270" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom edge intentionally left plain — the container already has its own border -->

  <!-- subtle network graph filling the right side, cybersecurity texture -->
  <g transform="translate(700, 25)" opacity="0.55">
    <!-- connecting lines -->
    <path id="e1" d="M40,45 L150,20" stroke="#30363D" stroke-width="1"/>
    <path id="e2" d="M150,20 L235,72" stroke="#30363D" stroke-width="1"/>
    <path id="e3" d="M235,72 L330,35" stroke="#30363D" stroke-width="1"/>
    <path id="e4" d="M330,35 L392,112" stroke="#30363D" stroke-width="1"/>
    <path id="e5" d="M40,45 L62,145" stroke="#30363D" stroke-width="1"/>
    <path id="e6" d="M62,145 L185,163" stroke="#30363D" stroke-width="1"/>
    <path id="e7" d="M185,163 L305,192" stroke="#30363D" stroke-width="1"/>
    <path id="e8" d="M305,192 L392,112" stroke="#30363D" stroke-width="1"/>
    <path id="e9" d="M150,20 L185,163" stroke="#30363D" stroke-width="1"/>
    <path id="e10" d="M235,72 L305,192" stroke="#30363D" stroke-width="1"/>
    <path id="e11" d="M62,145 L102,212" stroke="#30363D" stroke-width="1"/>
    <path id="e12" d="M102,212 L185,163" stroke="#30363D" stroke-width="1"/>

    <!-- nodes -->
    <circle cx="40" cy="45" r="3.2" fill="#3FB950"/>
    <circle cx="150" cy="20" r="3.2" fill="#58A6FF"/>
    <circle cx="235" cy="72" r="3.2" fill="#3FB950"/>
    <circle cx="330" cy="35" r="3.2" fill="#58A6FF"/>
    <circle cx="392" cy="112" r="3.2" fill="#3FB950"/>
    <circle cx="62" cy="145" r="3.2" fill="#58A6FF"/>
    <circle cx="185" cy="163" r="3.2" fill="#3FB950"/>
    <circle cx="305" cy="192" r="3.2" fill="#58A6FF"/>
    <circle cx="102" cy="212" r="3.2" fill="#3FB950"/>

    <!-- traveling pulses representing traffic -->
    <circle r="2.6" fill="#58A6FF">
      <animateMotion dur="3s" repeatCount="indefinite" begin="0s">
        <mpath href="#e2"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#3FB950">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="0.8s">
        <mpath href="#e6"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.6s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle r="2.6" fill="#58A6FF">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.6s">
        <mpath href="#e10"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
    <circle r="2.6" fill="#3FB950">
      <animateMotion dur="4s" repeatCount="indefinite" begin="2.2s">
        <mpath href="#e4"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite" begin="2.2s"/>
    </circle>
  </g>

  <!-- live status indicator, right after "whoami" -->
  <circle cx="274" cy="90" r="4" fill="#3FB950"/>
  <circle cx="274" cy="90" r="4" fill="none" stroke="#3FB950" stroke-width="1.5">
    <animate attributeName="r" values="4;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal prompt line -->
  <text x="64" y="96" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="16" fill="#3FB950">
    kiarash@dev<tspan fill="#8B949E">:~$</tspan> whoami
  </text>

  <!-- name -->
  <text x="64" y="158" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#E6EDF3">Kiarash Habibi</text>

  <rect x="65" y="172" width="150" height="3" rx="1.5" fill="url(#accentV)"/>

  <text x="64" y="206" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="18" fill="#8B949E">
    Backend Developer <tspan fill="#30363D">//</tspan> <tspan fill="#58A6FF">Go</tspan> <tspan fill="#30363D">//</tspan> <tspan fill="#3FB950">Cybersecurity</tspan>
  </text>

  <text x="64" y="240" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="14" fill="#6E7681">
    Currently hunting bugs by day, hardening servers by night.
  </text>
</svg>
