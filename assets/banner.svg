<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D9F5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <rect x="0" y="0" width="6" height="280" fill="url(#accent)"/>

  <text x="70" y="95" font-family="Consolas, Menlo, monospace" font-size="15" fill="#00F5A0" opacity="0.85">$ whoami</text>

  <text x="70" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Kiarash Habibi</text>

  <text x="70" y="190" font-family="Consolas, Menlo, monospace" font-size="20" fill="#8FE9D0">Backend Developer <tspan fill="#4A6B75">//</tspan> Go <tspan fill="#4A6B75">//</tspan> Cybersecurity</text>

  <text x="70" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#B9C7CC">Building secure backend systems in Go — while breaking things (responsibly) on the offensive side.</text>

  <g transform="translate(950, 60)" opacity="0.9">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#0D1B1F" stroke="#2C5364" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#FF5F56"/>
    <circle cx="32" cy="16" r="4" fill="#FFBD2E"/>
    <circle cx="48" cy="16" r="4" fill="#27C93F"/>
    <text x="16" y="45" font-family="Consolas, Menlo, monospace" font-size="11" fill="#00F5A0">func main() {</text>
    <text x="28" y="63" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8FE9D0">Serve(secure)</text>
    <text x="28" y="81" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8FE9D0">Harden(system)</text>
    <text x="16" y="99" font-family="Consolas, Menlo, monospace" font-size="11" fill="#00F5A0">}</text>
  </g>
</svg>
